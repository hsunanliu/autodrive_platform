<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一鍵重置並登入</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 0;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .status.show {
            display: block;
        }
        .status.success {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #10b981;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }
        .status.loading {
            background: #dbeafe;
            color: #1e40af;
            border: 2px solid #3b82f6;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info-box {
            background: #f0f9ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #bae6fd;
        }
        .info-box p {
            margin: 5px 0;
            color: #0c4a6e;
            font-size: 14px;
        }
        .info-box strong {
            color: #0284c7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Dashboard 快速登入</h1>
        <p class="subtitle">自動清除舊資料並重新登入</p>

        <div class="info-box">
            <p><strong>Admin Email:</strong> admin@autodrive.com</p>
            <p><strong>Password:</strong> admin123</p>
        </div>

        <button onclick="resetAndLogin()" id="mainBtn">
            🔄 清除並自動登入
        </button>

        <button onclick="openDashboard()" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
            🎯 打開 Dashboard
        </button>

        <div id="status" class="status"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1/admin';
        const DASHBOARD_URL = 'http://localhost:5173/dashboard';

        function showStatus(message, type = 'loading') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status show ${type}`;
            statusDiv.innerHTML = message;
        }

        function hideStatus() {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status';
        }

        async function resetAndLogin() {
            const btn = document.getElementById('mainBtn');
            btn.disabled = true;

            try {
                // Step 1: Clear localStorage
                showStatus('<div class="spinner"></div><p>步驟 1/3: 清除舊資料...</p>', 'loading');
                localStorage.clear();
                await sleep(500);

                // Step 2: Login
                showStatus('<div class="spinner"></div><p>步驟 2/3: 登入中...</p>', 'loading');
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@autodrive.com',
                        password: 'admin123'
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || errorData.error || '登入失敗');
                }

                const data = await response.json();

                // Step 3: Save token
                showStatus('<div class="spinner"></div><p>步驟 3/3: 保存認證...</p>', 'loading');
                localStorage.setItem('adminToken', data.token);
                localStorage.setItem('adminData', JSON.stringify(data.admin));
                await sleep(500);

                // Success
                showStatus(`
                    <h3 style="margin-top: 0; color: #065f46;">✅ 登入成功！</h3>
                    <p>管理員：${data.admin.name}</p>
                    <p>Email：${data.admin.email}</p>
                    <p style="margin-top: 15px;">
                        <strong>正在跳轉至 Dashboard...</strong>
                    </p>
                `, 'success');

                await sleep(1500);
                window.location.href = DASHBOARD_URL;

            } catch (error) {
                showStatus(`
                    <h3 style="margin-top: 0; color: #991b1b;">❌ 登入失敗</h3>
                    <p><strong>錯誤訊息:</strong> ${error.message}</p>
                    <div style="margin-top: 15px; padding: 10px; background: #fee; border-left: 4px solid #f00; font-size: 12px;">
                        <p style="margin: 5px 0;"><strong>可能原因：</strong></p>
                        <ul style="margin: 5px 0; padding-left: 20px;">
                            <li>後端服務未啟動 (請檢查 Docker)</li>
                            <li>帳號或密碼錯誤</li>
                            <li>網路連線問題</li>
                        </ul>
                        <p style="margin-top: 10px;"><strong>資料庫中的管理員帳號：</strong></p>
                        <ul style="margin: 5px 0; padding-left: 20px;">
                            <li>admin@autodrive.com (密碼: admin123) ✓</li>
                            <li>admin@example.com (密碼: admin123)</li>
                        </ul>
                    </div>
                `, 'error');
                addLog(`Login failed: ${error.message}`, 'error');
                btn.disabled = false;
            }
        }

        function openDashboard() {
            const token = localStorage.getItem('adminToken');
            if (!token) {
                showStatus(`
                    <h3 style="margin-top: 0; color: #f59e0b;">⚠️ 提醒</h3>
                    <p>尚未登入，請先點擊上方「清除並自動登入」</p>
                `, 'error');
                return;
            }
            window.open(DASHBOARD_URL, '_blank');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 檢查當前登入狀態
        window.addEventListener('load', () => {
            const token = localStorage.getItem('adminToken');
            if (token) {
                try {
                    const adminData = JSON.parse(localStorage.getItem('adminData'));
                    showStatus(`
                        <h3 style="margin-top: 0; color: #0284c7;">ℹ️ 已登入</h3>
                        <p>管理員：${adminData.name}</p>
                        <p style="margin-top: 10px; font-size: 12px;">
                            如果 Dashboard 有問題，請點擊「清除並自動登入」
                        </p>
                    `, 'success');
                } catch (e) {
                    console.error('Parse error:', e);
                }
            }
        });
    </script>
</body>
</html>
